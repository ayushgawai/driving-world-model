[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="driving-world-model"
version="0.1.0"
description="Action-conditioned generative world model for autonomous driving (2D sim)"
readme="README.md"
license={text="MIT"}
requires-python=">=3.11"
dependencies=["numpy>=1.26","torch>=2.2","matplotlib>=3.8"]
[project.optional-dependencies]
dev=["pytest>=8","ruff>=0.5","onnx>=1.16","onnxscript","onnxruntime>=1.18"]
[tool.setuptools.packages.find]
include=["dwm*"]
[tool.ruff]
line-length=100
[tool.ruff.lint]
ignore=["BLE001","RUF059","SIM115","I001"]  # ponytail: compact one-file modules; blind-except only for optional onnxruntime fallback
[tool.pytest.ini_options]
testpaths=["tests"]
